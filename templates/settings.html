{% extends "layout.html" %}

{% block title %}
    Settings
{% endblock %}

{% block body %}
    <div class="main_content">
        <header class="exp_header">
            <h2 id="project_n">Settings</h2>
        </header>
        <div class="settings_section">
            <div class="settings_card">
                <h3>Capital Configuration</h3>

                <div class="settings_item">
                    <label>Starting Capital (₹)</label>
                    <input type="number" id="starting_capital_input" placeholder="0">
                    <button class="btn_small" id="save_starting_capital">Save</button>
                </div>

                <div class="settings_item" style="margin-top:12px;">
                    <label>Reset Net Capital</label>
                    <button class="btn_danger" id="reset_capital_btn">
                        Reset (Admin Only)
                    </button>
                </div>
            </div>
            <div class="settings_card">
                <h3>Manage Categories</h3>

                <div class="category_section_wrap">
                    <div class="cat_box">
                        <h4>Income Categories</h4>

                        <div class="tag_list" id="income_categories_list">
                        </div>

                        <button class="btn_small" id="add_income_category_btn">
                            + Add Income Category
                        </button>
                    </div>

                    <div class="cat_box">
                        <h4>Expense Categories</h4>

                        <div class="tag_list" id="expense_categories_list">
                        </div>

                        <button class="btn_small" id="add_expense_category_btn">
                            + Add Expense Category
                        </button>
                    </div>

                </div>
            </div>
            <div class="settings_card">
                <h3>Project Tags</h3>

                <div class="tag_list" id="project_tags_list">
                </div>

                <button class="btn_small" id="add_project_tag_btn">
                    + Add Project Tag
                </button>
            </div>

        </div>
    </div>
    <div class="modal" id="tag_modal">
        <div class="modal_content">
            <h3 id="tag_modal_title">Add Item</h3>

            <label>Name</label>
            <input type="text" id="tag_name_input" placeholder="Enter name">

            <div class="modal_actions">
                <button id="save_tag_btn">Save</button>
                <button id="cancel_tag_btn">Cancel</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/settings.js') }}"></script>

{% endblock %}
