{% extends "layout.html" %}

{% block title %}Receipts{% endblock %}

{% block body %}
    <div class="main_content">

        <header class="exp_header">
            <h2 id="project_n">Receipts</h2>
            <button id="add_receipt_btn">+ Add Receipt</button>
        </header>

        <div class="expenses_section">

            <div class="filter_bar">
                <input type="search" id="receipt_search" placeholder="Search receipts...">
                <select id="filter_receipt_category">
                    <option value="">All Categories</option>
                </select>
                <input type="date" id="filter_receipt_date">
            </div>

            <div id="controls" style="margin-bottom: 20px;">
                <label>Sort By: </label>
                <select id="receipt_sort">
                    <option value="date">Date</option>
                    <option value="title">Title</option>
                    <option value="category">Category</option>
                </select>
            </div>

            <div class="table_container">
                <table id="receipt_table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Vendor</th>
                            <th>Amount</th>
                            <th>Receipt</th>
                            <th>Notes</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="addReceiptModal" class="modal">
            <div class="modal_content">
                <h3>Add New Receipt</h3>
                <form id="add_receipt_form">
                    <label>Title</label>
                    <input type="text" id="r_title" required>
                    <label>Date</label>
                    <input type="date" id="r_date" required>
                    <label>Amount (₹)</label>
                    <input type="number" id="r_amount" required>
                    <label>Category</label>
                    <select id="r_category" required>
                        <option value="">Select Category</option>
                        <option value="Hardware">Hardware</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Rent">Rent</option>
                        <option value="Shipping">Shipping</option>
                    </select>
                    <label>Vendor</label>
                    <input type="text" id="r_vendor" required>
                    <label>Upload Receipt Image</label>
                    <input type="file" id="r_image" accept="image/*">
                    <label>Notes (optional)</label>
                    <textarea id="r_notes" rows="3"></textarea>
                    <div class="modal_actions">
                        <button type="submit">Save</button>
                        <button type="button" id="cancel_r_btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/receipts.js') }}"></script>
{% endblock %}
